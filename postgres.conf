# PostgreSQL performance tuning cho Odoo
# Áp dụng cho server 8GB RAM

# Network — bắt buộc phải có khi dùng custom config file với Docker
listen_addresses = '*'

# Memory
shared_buffers = 512MB           # ~25% RAM; cache data pages
work_mem = 16MB                  # memory per sort/hash; tăng tốc query phức tạp
maintenance_work_mem = 128MB     # VACUUM, CREATE INDEX
effective_cache_size = 2GB       # ước tính OS cache; giúp query planner

# Checkpoint
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB

# Connections
max_connections = 50             # giảm từ 100; mỗi connection tốn ~5MB

# Planner
random_page_cost = 1.1           # SSD: đặt 1.1; HDD giữ 4.0
effective_io_concurrency = 200   # SSD; HDD đặt 2

# Logging (tắt khi production)
log_min_duration_statement = 1000  # log query chậm hơn 1s
